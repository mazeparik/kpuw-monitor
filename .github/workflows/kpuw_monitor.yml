name: KPUW Slot Monitor

on:
  workflow_dispatch:
  schedule:
    # Польща зараз живе за зимовим часом (UTC+1).
    # Сесія 1: 07:00 UTC = 08:00 ранку в Польщі (працює 4.5 год: до 12:30)
    - cron: '0 7 * * 1-5'
    # Сесія 2: 11:30 UTC = 12:30 дня в Польщі (працює 4.5 год: до 17:00)
    - cron: '30 11 * * 1-5'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run KPUW Slot Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_INTERVAL_SECONDS: 45
          MAX_RUNTIME_MINUTES: 270 # 4.5 години безперервного моніторингу
        run: |
          python monitor.py
